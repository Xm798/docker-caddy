name: Build Docker Image

on:
  schedule:
    - cron: '0 3 */5 * *'
  workflow_dispatch:

env:
  APP_NAME: caddy

jobs:
  Dockerhub:
    name: Build Docker Image and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate app version
        run: echo "APP_VERSION=$(date +'%y%m%d')" >> $GITHUB_ENV
      - name: Set GHCR username
        run: |
          echo "GITHUB_USER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        with:
          push: true
          context: .
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.APP_NAME }}:latest
            ${{ env.DOCKERHUB_USER }}/${{ env.APP_NAME }}:${{ env.APP_VERSION }}
            ghcr.io/${{ env.GITHUB_USER }}/${{ env.APP_NAME }}:latest
            ghcr.io/${{ env.GITHUB_USER }}/${{ env.APP_NAME }}:${{ env.APP_VERSION }}
      - name: Build and push plus version
        uses: docker/build-push-action@v6
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        with:
          push: true
          context: .
          file: ./Dockerfile.plus
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.APP_NAME }}:plus
            ${{ env.DOCKERHUB_USER }}/${{ env.APP_NAME }}:plus-${{ env.APP_VERSION }}
            ghcr.io/${{ env.GITHUB_USER }}/${{ env.APP_NAME }}:plus
            ghcr.io/${{ env.GITHUB_USER }}/${{ env.APP_NAME }}:plus-${{ env.APP_VERSION }}
      # ACR rejects the attestation manifests BuildKit >= 0.32 emits (OCI empty config),
      # so copy only the platform images there and keep provenance on the other registries.
      - name: Copy images to ACR without attestations
        env:
          SRC_REPO: ghcr.io/${{ env.GITHUB_USER }}/${{ env.APP_NAME }}
          ACR_REPO: registry.cn-shanghai.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/${{ env.APP_NAME }}
        run: |
          copy() {
            local src="$SRC_REPO:$1"; shift
            local tags=() refs
            for t in "$@"; do tags+=(-t "$ACR_REPO:$t"); done
            refs=$(docker buildx imagetools inspect --raw "$src" | jq -r --arg repo "$SRC_REPO" \
              '.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | "\($repo)@\(.digest)"')
            docker buildx imagetools create "${tags[@]}" $refs
          }
          copy "$APP_VERSION" latest "$APP_VERSION"
          copy "plus-$APP_VERSION" plus "plus-$APP_VERSION"
